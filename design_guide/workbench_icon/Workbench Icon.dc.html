<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-c251d477-87e4-48de-85b3-7c2dc4cb9c87/styles.css">
</helmet>
<div style="min-height:100vh;background:var(--color-bg);color:var(--color-text);padding:56px 48px 80px">
  <div style="max-width:960px;margin:0 auto">

    <div style="margin-bottom:44px">
      <div style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:8px">Workbench · Identity</div>
      <h1 style="font-size:40px;margin:0 0 6px;letter-spacing:-0.02em">앱 아이콘</h1>
      <p class="text-muted" style="font-size:15px;margin:0;max-width:560px">단일 스틸 액센트 위에 흰 렌치 마크. 블루프린트 그리드와 코너 등록 마크로 Industry 톤을 유지합니다.</p>
    </div>

    <div style="display:grid;grid-template-columns:280px 1fr;gap:40px;align-items:start">

      <!-- HERO -->
      <div>
        <div class="blueprint" style="width:240px;height:240px;padding:20px;display:grid;place-items:center;background:var(--color-bg)">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <img src="assets/workbench-icon.svg" alt="Workbench icon" style="width:200px;height:200px;display:block" />
        </div>
        <div class="text-muted" style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;margin-top:14px">마스터 · 512px · workbench-icon.svg</div>
      </div>

      <!-- SPECS + SIZES -->
      <div style="display:flex;flex-direction:column;gap:36px">

        <div>
          <h4 style="font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin:0 0 16px">크기별 렌더링</h4>
          <div style="display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap">
            <sc-for list="{{ sizes }}" as="s" hint-placeholder-count="5">
              <div style="display:flex;flex-direction:column;align-items:center;gap:9px">
                <img src="assets/workbench-icon.svg" alt="" style="{{ s.style }}" />
                <span class="text-muted" style="font-size:11px">{{ s.label }}</span>
              </div>
            </sc-for>
          </div>
        </div>

        <div>
          <h4 style="font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin:0 0 16px">파비콘 · 소형 · workbench-favicon.svg</h4>
          <p class="text-muted" style="font-size:13px;margin:0 0 16px;max-width:520px">작은 크기에서는 그리드/코너 마크를 뺀 렌치만 남긴 단순화 버전을 씁니다.</p>
          <div style="display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap">
            <sc-for list="{{ favSizes }}" as="s" hint-placeholder-count="4">
              <div style="display:flex;flex-direction:column;align-items:center;gap:9px">
                <img src="assets/workbench-favicon.svg" alt="" style="{{ s.style }}" />
                <span class="text-muted" style="font-size:11px">{{ s.label }}</span>
              </div>
            </sc-for>
          </div>
        </div>

        <div>
          <h4 style="font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin:0 0 16px">사용 예시</h4>
          <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
            <!-- top-bar brand lockup -->
            <div class="blueprint" style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--color-bg)">
              <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
              <img src="assets/workbench-favicon.svg" alt="" style="width:26px;height:26px;display:block" />
              <span style="font-family:var(--font-heading);font-weight:600;font-size:18px;letter-spacing:-0.01em">Workbench</span>
            </div>
            <!-- browser tab -->
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--color-surface);border:1px solid var(--color-divider);max-width:220px">
              <img src="assets/workbench-favicon.svg" alt="" style="width:16px;height:16px;flex:none;display:block" />
              <span style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Workbench — 도구 모음</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const box = (n) => ({ width: n, height: n, display: 'block', border: n >= 48 ? '1px solid var(--color-divider)' : 'none' });
    const mk = (n) => ({ label: n + 'px', style: box(n) });
    return {
      sizes: [128, 96, 64, 48, 32].map(mk),
      favSizes: [64, 48, 32, 16].map(mk),
    };
  }
}
</script>
</body>
</html>
