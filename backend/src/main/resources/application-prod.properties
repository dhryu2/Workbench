# 운영(prod) 프로파일 — SPRING_PROFILES_ACTIVE=prod 일 때 활성화
spring.application.name=backend

# 포트: 컨테이너 내부 리슨 포트 (SERVER_PORT 환경변수로 오버라이드 가능)
server.port=${SERVER_PORT:23001}

# 운영에서는 상세 에러 노출 최소화
server.error.include-message=never
server.error.include-stacktrace=never

# H2 콘솔은 운영에서 절대 노출되면 안 되므로 명시적으로 재확인 차단
spring.h2.console.enabled=false
