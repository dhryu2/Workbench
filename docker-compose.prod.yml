# ============================================================
#  Workbench — 운영 배포용 Docker Compose (GHCR pull 기반)
#
#  개발머신(빌드·푸시):
#    scripts/deploy.sh            # 빌드 → GHCR push → 서버 pull+up 원커맨드
#  운영서버(수동 배포):
#    docker compose -f docker-compose.prod.yml --env-file .env.production pull
#    docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# ============================================================

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/dhryu2/workbench-backend}:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-workbench}-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${BACKEND_CONTAINER_PORT:-23001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    expose:
      - "${BACKEND_CONTAINER_PORT:-23001}"
    networks:
      - workbench

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/dhryu2/workbench-frontend}:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 빌드 타임에 번들로 구워지는 백엔드 API 주소
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: ${PROJECT_NAME:-workbench}-frontend
    restart: unless-stopped
    ports:
      # 호스트 23000 → 컨테이너 nginx 80. Cloudflare Tunnel이 이 포트를 도메인에 연결.
      - "${FRONTEND_HOST_PORT:-23000}:80"
    depends_on:
      - backend
    networks:
      - workbench

networks:
  workbench:
    driver: bridge
